/* Identidad gráfica de Asombro · Rutas (Compartir): azul marino #003968, verde #20a875, amarillo #fbc700, letras A en el fondo, formas orgánicas y Riffic. Plan: mapa curricular tipo plano de metro. Papel cálido, tinta azul-grisácea; tres ejes = tres líneas de color
   (morado Número, ámbar Forma, azul Datos) como en el esquema original. Fraunces para títulos, Instrument Sans para UI. */
:root{
  color-scheme:light;
  --navy:#003968; --navy2:#164a75; --green:#20a875; --green-d:#16805a; --yellow:#fbc700;
  --bg:#003968; --panel:#ffffff; --fg:#12304f; --muted:#5d7288; --line:#d3dde8; --card:#ffffff; --card-hover:#f4f8fc;
  --n:#8f0c6f; --f:#e3a900; --d:#2d73b5; --x:#8a94a0;
  --soft:#f0f4f8; --n-soft:#f6e4f0; --f-soft:#fff3cc; --d-soft:#e1eef9; --x-soft:#eceff2;
  --accent:#003968; --accent-fg:#ffffff; --shadow:0 1px 2px rgba(0,40,80,.12),0 8px 20px rgba(0,40,80,.14);
  --head:'Riffic','Arial Rounded MT Bold',system-ui,sans-serif; --ui:'K2D',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);position:relative;min-height:100vh;overflow-x:hidden;font-family:var(--ui);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
button{font:inherit;color:inherit;cursor:pointer}
.bgA{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgA b{position:absolute;font-family:var(--head);font-weight:700;color:rgba(255,255,255,.055);line-height:1}
.app{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;max-width:100%}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.logo{height:92px;width:auto;max-width:40vw;display:block}
h1{font-family:var(--head);font-weight:700;color:#fff;font-size:clamp(24px,4vw,38px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--c);vertical-align:middle;margin-right:5px}
.legend i.dash{border-top-style:dashed}
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.seg,.chips{display:flex;flex-wrap:wrap;gap:4px}
.seg{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:2px;background:rgba(255,255,255,.1)}
.seg button{color:#fff}
.seg button,.chip,.tgl{border:1px solid transparent;background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--navy);font-weight:600}
.chip{border-color:transparent;background:#fff;color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:#fff;border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.chip[aria-pressed="false"]{opacity:.6}
.tgl{border-color:var(--line);background:var(--panel)}
.tgl[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
input[type=search]{font:inherit;border:1px solid transparent;background:#fff;color:var(--fg);border-radius:999px;padding:5px 12px;min-width:0;width:260px;max-width:100%}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.status{min-height:20px;color:#cfe0ee;font-size:13px}

.mapwrap{position:relative;border:0;border-radius:22px;box-shadow:var(--shadow);background:var(--panel);overflow:hidden}
.map{height:calc(100vh - 210px);min-height:420px;overflow:auto;position:relative}
.inner{position:relative;display:flex;gap:64px;padding:0 20px 28px;width:max-content;min-width:100%}
svg.arrows{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
.col{width:206px;flex:none}
.col.lvl-start{margin-left:18px;position:relative}
.col.lvl-start::before{content:"";position:absolute;left:-41px;top:0;bottom:0;border-left:1px dashed var(--line)}
.colhead{position:sticky;top:0;z-index:5;background:var(--panel);padding:12px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.colhead .lv{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.colhead{text-align:center}
.bdg{display:inline-grid;place-items:center;width:64px;height:58px;border-radius:58% 42% 55% 45%/55% 58% 42% 45%;font-family:var(--head);font-weight:700;font-size:24px;color:#fff;background:var(--navy);margin:2px 0 4px}
.bdg.b1{background:var(--green);border-radius:44% 56% 42% 58%/58% 44% 56% 42%}
.colhead .lv{color:var(--green-d);font-weight:600}
.colhead .ct{font-size:12px;color:var(--muted)}
.tri{margin:14px 0 8px;display:flex;justify-content:center}
.tri span{background:var(--navy);color:#fff;font-family:var(--head);font-weight:700;font-size:13px;border-radius:7px;padding:3px 16px;box-shadow:0 2px 0 var(--green)}
.cards{display:flex;flex-direction:column;gap:7px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:7px 9px 8px;text-align:left;cursor:pointer;
  transition:opacity .15s,box-shadow .15s,transform .15s;min-width:0}
.card:hover{background:var(--card-hover);box-shadow:var(--shadow)}
.card .num{font-size:11px;font-weight:600;color:var(--c);letter-spacing:.03em}
.card .tt{font-weight:600;font-size:13.5px;line-height:1.25;text-wrap:balance;padding-right:26px;overflow-wrap:anywhere}
.card .ap{font-size:12px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.compact .card .ap{display:none}
.card.eje-N{--c:var(--n);--cs:var(--n-soft)}.card.eje-F{--c:var(--f);--cs:var(--f-soft)}.card.eje-D{--c:var(--d);--cs:var(--d-soft)}.card.eje--{--c:var(--x);--cs:var(--x-soft)}
.card.dim{opacity:.22}
.card.on{background:var(--cs);box-shadow:var(--shadow);border-color:var(--c)}
.card.sel{outline:2px solid var(--navy);outline-offset:1px}
.route{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0;color:var(--c)}
.route:hover,.card.on .route{background:var(--c);color:var(--accent-fg);border-color:var(--c)}
.route svg{width:14px;height:14px}
path.e{fill:none;stroke:var(--c);stroke-width:2.2}
path.e.faint{stroke-width:1.4;opacity:.35}
path.e.dash{stroke-dasharray:6 5}
.hint{display:none;position:absolute;left:12px;bottom:10px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}

.drawer{position:fixed;z-index:20;background:var(--panel);color:var(--fg);box-shadow:var(--shadow);border:1px solid var(--line);overflow:auto;
  right:0;top:0;bottom:0;width:min(400px,100vw);padding:18px max(18px,env(safe-area-inset-right,0px)) 28px 18px;padding-top:calc(18px + env(safe-area-inset-top,0px));
  transform:translateX(105%);transition:transform .22s ease;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer .x{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));border:1px solid var(--line);background:var(--soft);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1}
.drawer h2{font-family:var(--ui);color:var(--navy);font-weight:700;font-size:21px;line-height:1.2;margin:8px 36px 10px 0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--soft)}
.pill.eje{background:var(--cs);border-color:var(--c);color:var(--fg)}
.sec{margin-top:16px}
.sec h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--green-d);margin:0 0 6px;font-weight:600}
.sec p{margin:0}
.res{display:flex;flex-wrap:wrap;gap:6px}
.res span{border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--soft);font-size:13px}
.res span.no{color:var(--muted);border-style:dashed}
.matex{margin:8px 0 0;padding-left:18px;font-size:13px}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:8px}
.btn{border:0;background:var(--green);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.steps li{position:relative;padding:0 0 14px 22px;border-left:3px solid var(--c);margin-left:6px}
ol.steps li:last-child{border-left-color:transparent;padding-bottom:0}
ol.steps li::before{content:"";position:absolute;left:-8px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--panel);border:3px solid var(--c)}
ol.steps li.dsh{border-left-style:dashed}
ol.steps li.cur::before{background:var(--c)}
ol.steps button{background:none;border:0;padding:0;text-align:left;width:100%}
ol.steps .g{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
ol.steps .t{font-weight:600}
ol.steps .a{font-size:12.5px;color:var(--muted)}
ol.steps li.cur .t{text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){
  .logo{height:64px}
  .map{height:calc(100vh - 300px)}
  .col{width:178px}
  .inner{gap:48px}
  .col.lvl-start::before{left:-31px}
}
h3.x{}
.gh{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.mem{display:block;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:4px 8px;margin-bottom:4px;font-size:13px}
.mem span{font-weight:600;color:var(--c);font-size:11px;margin-right:4px}
.mem i{font-style:normal;color:var(--muted)}
.mem.cur{background:var(--card-hover);outline:1.5px solid var(--fg)}
/* Panel de detalle: abajo en pantallas medianas/chicas, lateral solo si hay ancho de sobra; el mapa nunca queda tapado */
.drawer{top:auto;left:0;right:0;bottom:0;width:auto;height:42vh;border-radius:14px 14px 0 0;transform:translateY(105%);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.dopen{padding-bottom:calc(42vh + 12px)}
body.dopen .map{height:max(260px,calc(100vh - 230px - 42vh))}
@media (min-width:1000px){
  .drawer{top:0;left:auto;width:340px;height:auto;border-radius:0;transform:translateX(105%);padding:18px 18px 28px}
  body.dopen{padding-bottom:14px}
  body.dopen .app{margin-right:340px}
  body.dopen .map{height:calc(100vh - 210px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Estructuras derivadas */
const SEQ = {};      // id -> secuencia
const ORDER = {};    // grado -> lista de ids
GRADES.forEach(([g]) => {
  ORDER[g] = [];
  RAW[g].forEach(r => {
    const [n, titulo, pp, ac, matex, ltg, eje, nota] = r;
    const [a, b] = TRIM[g];
    const t = n <= a ? 1 : (n <= b ? 2 : 3);
    let ltgTxt = ltg;
    if (ltg.startsWith("=")) ltgTxt = ltg.slice(1);
    else if (ltg && PFX[g]) ltgTxt = PFX[g] + ltg;
    const id = g + "-" + n;
    SEQ[id] = { id, g, n, t, titulo, pp, ac, matex, ltg: ltgTxt, eje, nota: nota || "", puente: n === 0 };
    ORDER[g].push(id);
  });
});
const EDGES = ARROWS.map(([g0, s0, g1, s1, eje, ln]) => ({ a: g0 + "-" + s0, b: g1 + "-" + s1, eje, ln }));
const OUT = {}, INN = {};
EDGES.forEach(e => { OUT[e.a] = e; INN[e.b] = e; });
function chainOf(id) {
  let s = id;
  while (INN[s]) s = INN[s].a;
  const list = [s];
  while (OUT[list[list.length - 1]]) list.push(OUT[list[list.length - 1]].b);
  return list;
}
/* FIN DATOS */

const EJE_KEY = {N:'n',F:'f',D:'d','-':'x'};
const SHORT = {N:'Número, álgebra y variación',F:'Forma, espacio y medida',D:'Análisis de datos','-':'Sin eje'};
const st = {sel:null, hl:null, level:'all', ejes:new Set(['N','F','D']), q:'', all:false, compact:false};

/* eje: la flecha manda; el resto es asignación por tema */
const connected = new Set();
EDGES.forEach(e=>{connected.add(e.a);connected.add(e.b);SEQ[e.a].eje=e.eje;SEQ[e.b].eje=e.eje});
Object.values(SEQ).forEach(s=>{s.inf=!connected.has(s.id)&&s.eje!=='-'});

/* TEMAS: asignación propia (el esquema solo enlaza con flechas la última → primera secuencia de cada tema) */

const TS={
P1:'OTR NAT NAT SUM TIE MED EST NAT NAT NAT SUM TIE FIG MED SUM SUM SUM FIG CUE TIE MED',
P2:'NAT SUM SUM SUM MUL FIG TIE NAT SUM MUL CUE MED EST EST NAT SUM SUM MUL DIV MED EST',
P3:'NAT NAT FRA FRA MED MUL FIG SUM FRA SUM MUL MUL FIG MED SUM DIV DIV CUE UBI TIE EST',
P4:'NAT NAT SUM DEC FRA MED FIG FIG PAR FRA SUM SUM SUM CUE UBI EST EST MUL SUM MUL MUL DIV DIV TIE MED PAR',
P5:'DEC SUM MUL SUM FIG CUE EST MUL MUL DIV PRO MED PAR PRB DIV DIV PRO PRO ENT UBI PAR',
P6:'DEC SUM MUL DIV SUC UBI FIG NAT SUC PRO PRO PRO FIG CUE ENT UBI PAR CUE PAR EST EST PRB',
S1:'SUM MUL ENT ENT ENT ALG FIG OTR PRO PRO SUC ALG FIG EST PRO ALG DEC FIG PAR EST PRB',
S2:'POT POT POT POT POT ALG FIG SUC ALG ALG FIG FIG MED EST ALG ALG PRO PAR PAR EST PRB',
S3:'ALG ALG ALG CUE TRI TRI ALG PRO PRO TRI EST OTR ALG ALG TRI PAR PRB PRB'};
const TEMA_SET={};
Object.keys(TEMAS).forEach(k=>TEMA_SET[k]=new Set());
GRADES.forEach(([g])=>{const a=TS[g].split(' ');ORDER[g].forEach((id,i)=>{SEQ[id].tema=a[i];TEMA_SET[a[i]].add(id)})});
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const ARROW_SVG='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 L12 4 M6 4 H12 V10"/></svg>';

/* ---------- construcción ---------- */
const inner=$('inner'), svg=$('svg');
GRADES.forEach(([g,lv,lab],i)=>{
  const col=document.createElement('section');
  col.className='col'+(g==='S1'?' lvl-start':'');
  col.dataset.g=g; col.dataset.lv=lv;
  const ids=ORDER[g];

  let h=`<div class="colhead"><div class="lv">${lv}</div><div class="gr"><span class="bdg b${GRADES.findIndex(x=>x[0]===g)%2}">${lab}</span></div><div class="ct">${real} secuencias</div></div>`;
  [1,2,3].forEach(t=>{
    const L=ids.filter(id=>SEQ[id].t===t);
    if(!L.length)return;
    h+=`<div class="tri"><span>Trimestre ${t}</span></div><div class="cards">`;
    L.forEach(id=>{
      const s=SEQ[id];
      h+=`<div class="card eje-${s.eje}" id="c-${id}" data-id="${id}" tabindex="0" role="button" aria-label="${esc(lab+' · '+(s.n?'Secuencia '+s.n+' · ':'')+s.titulo)}">`+
         `<div class="num">${s.n?'S'+s.n:'Apertura'}</div><div class="tt">${esc(s.titulo)}</div>`+

         `</div>`;

/* chips de eje */
$('ejes').innerHTML=['N','F','D'].map(k=>`<button class="chip" data-e="${k}" aria-pressed="true" style="--c:var(--${EJE_KEY[k]});--cs:var(--${EJE_KEY[k]}-soft)">${SHORT[k]}</button>`).join('');

/* ---------- estado → vista ---------- */
function matches(s){
  if(!st.ejes.has(s.eje) && s.eje!=='-') return false;
  if(s.eje==='-' && st.ejes.size<3) return false;
  if(st.q){const t=norm(s.titulo+' '+s.ac+' '+s.matex);return t.includes(norm(st.q))}
  return true;
}
function filtersActive(){return st.ejes.size<3||!!st.q}
function render(){
  document.querySelectorAll('.col').forEach(c=>{c.hidden=!(st.level==='all'||c.dataset.lv===st.level)});
  $('inner').classList.toggle('compact',st.compact);
  const chainSet=st.hl?st.hl.set:null;
  let vis=0;
  Object.values(SEQ).forEach(s=>{
    const el=$('c-'+s.id);
    let on=false,dim=false;
    if(chainSet){on=chainSet.has(s.id);dim=!on}
    else if(filtersActive()){dim=!matches(s);if(!dim)vis++}
    el.classList.toggle('on',on);el.classList.toggle('dim',dim);el.classList.toggle('sel',st.sel===s.id);
  });
  $('status').textContent = chainSet
    ? `Tema destacado: ${TEMAS[st.hl.tema]} · ${st.hl.set.size} secuencias en ${new Set([...st.hl.set].map(x=>SEQ[x].g)).size} grados. Las flechas unen la última secuencia de un grado con la primera del siguiente.`
    : filtersActive() ? `${vis} secuencias coinciden con el filtro.` : '';
  document.querySelectorAll('#lvl button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.level));
  document.querySelectorAll('#ejes .chip').forEach(b=>b.setAttribute('aria-pressed',st.ejes.has(b.dataset.e)));
  requestAnimationFrame(draw);
  renderDrawer();
}

/* ---------- flechas ---------- */
function draw(){
  const base=inner.getBoundingClientRect();
  svg.setAttribute('width',inner.scrollWidth);svg.setAttribute('height',inner.scrollHeight);
  const list=[];
  if(st.hl){const S=st.hl.set;EDGES.forEach(e=>{if(S.has(e.a)&&S.has(e.b))list.push([e,false])})}
  else if(st.all)EDGES.forEach(e=>list.push([e,true]));
  if(st.hl&&st.all)EDGES.forEach(e=>{if(!(st.hl.set.has(e.a)&&st.hl.set.has(e.b)))list.push([e,true])});
  let out='';
  list.sort((x,y)=>x[1]===y[1]?0:(x[1]?-1:1));
  list.forEach(([e,faint])=>{
    const A=$('c-'+e.a),B=$('c-'+e.b);
    if(A.closest('.col').hidden||B.closest('.col').hidden)return;
    const ra=A.getBoundingClientRect(),rb=B.getBoundingClientRect();
    const x1=ra.right-base.left,y1=ra.top+ra.height/2-base.top,x2=rb.left-base.left,y2=rb.top+rb.height/2-base.top;
    const dx=Math.max(24,(x2-x1)*.55);
    const k=EJE_KEY[e.eje];
    const hide=faint&&st.hl?' style="opacity:.12"':'';
    out+=`<path class="e${faint?' faint':''}${e.ln==='D'?' dash':''}" style="--c:var(--${k});${hide?'opacity:.12':''}" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2-7},${y2}"/>`+
         `<path d="M${x2},${y2} l-9,-5 v10 z" style="fill:var(--${k});${faint?'opacity:'+(st.hl?.12:.5):''}"/>`;
  });
  svg.innerHTML=out;
}

/* ---------- detalle ---------- */
function gradeLabel(g){return g[1]+'.° '+(g[0]==='P'?'primaria':'secundaria')}
function renderDrawer(){
  const d=$('drawer');
  document.body.classList.toggle('dopen',!!st.sel);
  if(!st.sel){d.classList.remove('open');return}
  const s=SEQ[st.sel],k=EJE_KEY[s.eje];
  const mx=s.matex?s.matex.split(/,\s(?=\d+\.\s)/):[];
  const prim=s.g[0]==='P';
  let res='';
  if(s.puente){res=''}
  else{
    if(prim&&mx.length) res+=`<span><b>Mátex</b> · ${mx.length} ${mx.length>1?'actividades':'actividad'}</span>`;
    if(s.id!=='P6-14') res+='<span><b>Códex</b></span>';
    else res+='<span><b>Códex</b> (según el esquema de primaria)</span>';
    res+='<span><b>Ejercicios imprimibles</b></span>';
  }
  const active=st.hl&&st.hl.set.has(s.id);
  const th=active?st.hl.tema:s.tema;
  let prog='';
  if(th==='OTR'){prog=''}
  else{
    const mem=TEMA_SET[th];
    prog=`<p style="margin-bottom:10px">Tema: <b>${esc(TEMAS[th])}</b> · ${mem.size} secuencias</p>`;
    if(!active) prog+=`<button class="btn" data-route="${s.id}">Resaltar este tema en el mapa</button>`;
    else{
      prog+=GRADES.map(([g])=>{const L=ORDER[g].filter(id=>st.hl.set.has(id));if(!L.length)return '';
        return `<div class="gh">${gradeLabel(g)}</div>`+L.map(id=>{const q=SEQ[id];
          return `<button class="mem${id===s.id?' cur':''}" data-go="${id}" style="--c:var(--${EJE_KEY[q.eje]})"><span>S${q.n}</span> ${esc(q.titulo)}${connected.has(id)&&chainOf(id).some(x=>st.hl.set.has(x)&&x!==id)?' <i title="Conectada por flecha">↗</i>':''}</button>`}).join('')}).join('');
      const chain=chainOf(s.id);
      if(chain.length>1) prog+=`<h3 style="margin-top:16px">Ruta con flechas de esta secuencia</h3><ol class="steps" style="--c:var(--${k})">`+chain.map((id,i)=>{
        const q=SEQ[id];const e=i<chain.length-1?OUT[id]:null;
        return `<li class="${id===s.id?'cur':''}${e&&e.ln==='D'?' dsh':''}"><button data-go="${id}"><div class="g">${gradeLabel(q.g)} · S${q.n}</div><div class="t">${esc(q.titulo)}</div></button></li>`}).join('')+'</ol>';
    }
  }
  $('drawer').innerHTML=`<button class="x" aria-label="Cerrar" data-close>×</button>
   <div class="meta" style="--c:var(--${k});--cs:var(--${k}-soft)">
     <span class="pill">${gradeLabel(s.g)}</span>${s.n?`<span class="pill">Secuencia ${s.n}</span>`:''}<span class="pill">Trimestre ${s.t}</span>
     ${s.eje!=='-'?`<span class="pill eje">${SHORT[s.eje]}${s.inf?' · asignado por tema':''}</span>`:''}</div>
   <h2>${esc(s.titulo)}</h2>
   ${s.ac?`<div class="sec"><h3>Aprendizaje (Compartir)</h3><p>${esc(s.ac)}</p></div>`:''}
   ${res||mx.length||s.nota?`<div class="sec"><h3>Recursos</h3>${res?`<div class="res">${res}</div>`:''}
     ${mx.length?`<ol class="matex">${mx.map(m=>`<li value="${parseInt(m)}">${esc(m.replace(/^\d+\.\s*/,''))}</li>`).join('')}</ol>`:''}
     ${s.nota?`<div class="note">${esc(s.nota)}</div>`:''}</div>`:''}
   <div class="sec"><h3>Páginas</h3><p>pp. ${esc(s.pp)}</p></div>
   ${s.ltg?`<div class="sec"><h3>Vinculación con libros de texto (LTG)</h3><p>${esc(s.ltg)}</p></div>`:''}
   ${prog?`<div class="sec"><h3>Progresión</h3>${prog}</div>`:''}`;
  d.classList.add('open');
}

/* ---------- acciones ---------- */
function focusMap(){if(innerWidth<1000)setTimeout(()=>$('map').scrollIntoView({block:'start',behavior:'smooth'}),60)}
function select(id){
  st.sel=id;focusMap();
  if(st.hl&&!st.hl.set.has(id))st.hl=null;
  render();
}
function route(id){
  const s=SEQ[id];if(s.tema==='OTR')return;
  const set=new Set(TEMA_SET[s.tema]);chainOf(id).forEach(x=>set.add(x));
  st.sel=id;st.hl={tema:s.tema,set};focusMap();
  if(st.level!=='all'&&new Set([...set].map(x=>SEQ[x].g[0])).size>1)st.level='all';
  render();
  requestAnimationFrame(()=>{
    const m=$('map'),mb=m.getBoundingClientRect(),r=$('c-'+id).getBoundingClientRect();
    m.scrollTo({left:m.scrollLeft+r.left+r.width/2-(mb.left+mb.width/2),top:m.scrollTop+r.top+r.height/2-(mb.top+mb.height/2),behavior:'smooth'});
  });
}
function clearAll(){st.sel=null;st.hl=null;st.ejes=new Set(['N','F','D']);st.q='';$('q').value='';render()}

document.addEventListener('click',ev=>{
  const r=ev.target.closest('[data-route]');if(r){ev.stopPropagation();route(r.dataset.route);return}
  if(ev.target.closest('[data-close]')){st.sel=null;st.hl=null;render();return}
  const go=ev.target.closest('[data-go]');if(go){st.sel=go.dataset.go;render();const el=$('c-'+st.sel);el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});return}
  const c=ev.target.closest('.card');if(c){select(c.dataset.id);return}
  const lv=ev.target.closest('#lvl button');if(lv){st.level=lv.dataset.v;render();return}
  const ch=ev.target.closest('#ejes .chip');if(ch){const e=ch.dataset.e;st.ejes.has(e)?st.ejes.delete(e):st.ejes.add(e);if(!st.ejes.size)st.ejes=new Set(['N','F','D']);render();return}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){st.sel=null;st.hl=null;render()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('card')){ev.preventDefault();select(ev.target.dataset.id)}
});
$('q').addEventListener('input',ev=>{st.q=ev.target.value.trim();render()});
new ResizeObserver(()=>requestAnimationFrame(draw)).observe($('map'));
window.addEventListener('resize',()=>requestAnimationFrame(draw));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>draw());
render();
</script>

</body></html>
